name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 4 - Trigger Pipeline
      - name: Run CI Pipeline
        run: echo "CI pipeline triggered successfully"

      # Step 5 - Checkout Source Code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 7 - Static Code Analysis
      - name: Static Code Analysis
        run: |
          pip install flake8
          flake8 .

      # Step 10 - Security & Vulnerability Scan
      - name: Security Scan
        run: |
          pip install pip-audit
          pip-audit
